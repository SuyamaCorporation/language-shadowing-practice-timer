<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言語シャドーイング練習タイマー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen text-white p-4">
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold text-center text-purple-400 mb-6">言語シャドーイング練習タイマー</h1>

  <div class="bg-gray-800 rounded-xl p-5 mb-5">
    <h2 class="text-sm font-semibold text-gray-400 mb-3">設定</h2>
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div>
        <label for="set-count" class="block text-xs text-gray-400 mb-1">セット数</label>
        <input id="set-count" type="number" min="1" max="20" value="5" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
      <div>
        <label for="set-duration" class="block text-xs text-gray-400 mb-1">1セット（秒）</label>
        <input id="set-duration" type="number" min="10" max="300" value="30" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
      <div>
        <label for="break-duration" class="block text-xs text-gray-400 mb-1">休憩（秒）</label>
        <input id="break-duration" type="number" min="5" max="120" value="10" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
    </div>
    <button id="start-btn" aria-label="練習を開始" class="w-full bg-purple-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-purple-700 transition">開始</button>
  </div>

  <div id="timer-section" class="hidden bg-gray-800 rounded-xl p-6 mb-5 text-center">
    <div id="phase-label" class="text-sm font-semibold text-purple-400 mb-2 uppercase tracking-widest">SHADOWING</div>
    <div id="timer-display" class="text-8xl font-mono font-bold mb-4 tabular-nums">30</div>
    <div id="set-info" class="text-sm text-gray-400 mb-6">セット 1 / 5</div>
    <div class="flex gap-3 justify-center">
      <button id="pause-btn" aria-label="一時停止" class="bg-gray-700 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition font-semibold">一時停止</button>
      <button id="stop-btn" aria-label="練習を終了" class="bg-red-700 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition font-semibold">終了</button>
    </div>
  </div>

  <div id="complete-section" class="hidden bg-purple-900 rounded-xl p-5 mb-5 text-center">
    <div class="text-4xl mb-2">完了！</div>
    <div id="complete-info" class="text-sm text-purple-200"></div>
    <button id="reset-btn" aria-label="もう一度" class="mt-4 bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition font-semibold">もう一度</button>
  </div>

  <div class="bg-gray-800 rounded-xl p-5">
    <h2 class="text-sm font-semibold text-gray-400 mb-3">練習記録</h2>
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="text-center">
        <div class="text-2xl font-bold text-purple-400" id="stat-today">0</div>
        <div class="text-xs text-gray-500">本日ラップ数</div>
      </div>
      <div class="text-center">
        <div class="text-2xl font-bold text-purple-400" id="stat-total-min">0</div>
        <div class="text-xs text-gray-500">累計（分）</div>
      </div>
      <div class="text-center">
        <div class="text-2xl font-bold text-purple-400" id="stat-streak">0</div>
        <div class="text-xs text-gray-500">週間ストリーク</div>
      </div>
    </div>
    <div id="week-grid" class="flex gap-1 justify-center"></div>
  </div>
</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

const STORAGE_KEY = 'app_language-shadowing-practice-timer';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {sessions: [], totalSecs: 0}; } catch { return {sessions: [], totalSecs: 0}; }
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

function todayStr() { return new Date().toISOString().split('T')[0]; }
function dateStr(d) { return d.toISOString().split('T')[0]; }

let timer = null;
let state = null;

function startTimer() {
  const sets = parseInt(document.getElementById('set-count').value);
  const setDur = parseInt(document.getElementById('set-duration').value);
  const breakDur = parseInt(document.getElementById('break-duration').value);

  state = {
    totalSets: sets,
    setDur,
    breakDur,
    currentSet: 1,
    phase: 'shadow',
    remaining: setDur,
    totalLaps: 0,
    sessionSecs: 0
  };

  document.getElementById('timer-section').classList.remove('hidden');
  document.getElementById('complete-section').classList.add('hidden');
  document.querySelector('.bg-gray-800:first-child').classList.add('opacity-50', 'pointer-events-none');
  updateDisplay();
  tick();
}

function tick() {
  if (timer) clearInterval(timer);
  timer = setInterval(() => {
    if (!state) return;
    state.remaining--;
    state.sessionSecs++;
    updateDisplay();

    if (state.remaining <= 0) {
      if (state.phase === 'shadow') {
        state.totalLaps++;
        if (state.currentSet >= state.totalSets) {
          finishSession();
          return;
        }
        state.phase = 'break';
        state.remaining = state.breakDur;
      } else {
        state.phase = 'shadow';
        state.currentSet++;
        state.remaining = state.setDur;
      }
      updateDisplay();
    }
  }, 1000);
}

function updateDisplay() {
  if (!state) return;
  document.getElementById('timer-display').textContent = String(state.remaining).padStart(2, '0');
  document.getElementById('phase-label').textContent = state.phase === 'shadow' ? 'SHADOWING' : 'BREAK';
  document.getElementById('phase-label').className = 'text-sm font-semibold mb-2 uppercase tracking-widest ' + (state.phase === 'shadow' ? 'text-purple-400' : 'text-green-400');
  document.getElementById('set-info').textContent = 'セット ' + state.currentSet + ' / ' + state.totalSets;
}

function finishSession() {
  clearInterval(timer);
  timer = null;
  const data = loadData();
  data.sessions.push({ date: todayStr(), laps: state.totalLaps, secs: state.sessionSecs });
  data.totalSecs = (data.totalSecs || 0) + state.sessionSecs;
  saveData(data);

  document.getElementById('complete-info').textContent =
    state.totalLaps + 'ラップ完了 / ' + Math.round(state.sessionSecs / 60) + '分';
  document.getElementById('timer-section').classList.add('hidden');
  document.getElementById('complete-section').classList.remove('hidden');
  document.querySelector('.bg-gray-800:first-child').classList.remove('opacity-50', 'pointer-events-none');
  state = null;
  renderStats();
}

function renderStats() {
  const data = loadData();
  const today = todayStr();
  const todaySessions = data.sessions.filter(s => s.date === today);
  const todayLaps = todaySessions.reduce((a, b) => a + b.laps, 0);
  document.getElementById('stat-today').textContent = todayLaps;
  document.getElementById('stat-total-min').textContent = Math.round((data.totalSecs || 0) / 60);

  const days = new Set(data.sessions.map(s => s.date));
  let streak = 0;
  const now = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    if (days.has(dateStr(d))) streak++;
    else if (i > 0) break;
  }
  document.getElementById('stat-streak').textContent = streak;

  const weekGrid = document.getElementById('week-grid');
  weekGrid.innerHTML = '';
  const DAY_JP = ['日','月','火','水','木','金','土'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const ds = dateStr(d);
    const hasSession = days.has(ds);
    const cell = document.createElement('div');
    cell.className = 'flex flex-col items-center gap-1';
    const dot = document.createElement('div');
    dot.className = 'w-8 h-8 rounded-full ' + (hasSession ? 'bg-purple-500' : 'bg-gray-700');
    const lbl = document.createElement('div');
    lbl.className = 'text-xs text-gray-500';
    lbl.textContent = DAY_JP[d.getDay()];
    cell.appendChild(dot);
    cell.appendChild(lbl);
    weekGrid.appendChild(cell);
  }
}

document.getElementById('start-btn').addEventListener('click', startTimer);

document.getElementById('pause-btn').addEventListener('click', () => {
  if (timer) {
    clearInterval(timer);
    timer = null;
    document.getElementById('pause-btn').textContent = '再開';
    document.getElementById('pause-btn').setAttribute('aria-label', '再開');
  } else {
    tick();
    document.getElementById('pause-btn').textContent = '一時停止';
    document.getElementById('pause-btn').setAttribute('aria-label', '一時停止');
  }
});

document.getElementById('stop-btn').addEventListener('click', () => {
  if (!confirm('練習を終了しますか？')) return;
  clearInterval(timer);
  timer = null;
  document.getElementById('timer-section').classList.add('hidden');
  document.querySelector('.bg-gray-800:first-child').classList.remove('opacity-50', 'pointer-events-none');
  state = null;
});

document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('complete-section').classList.add('hidden');
});

renderStats();
</script>
</body>
</html>
